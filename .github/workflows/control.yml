name: Attempt Stop Charging (Experimental)

on:
  workflow_dispatch: {}

jobs:
  attempt-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python control.py
        env:
          BYD_USERNAME: ${{ secrets.BYD_USERNAME }}
          BYD_PASSWORD: ${{ secrets.BYD_PASSWORD }}
          BYD_COUNTRY_CODE: ${{ secrets.BYD_COUNTRY_CODE }}
          BYD_BASE_URL: ${{ secrets.BYD_BASE_URL }}
          BYD_CONTROL_PIN: ${{ secrets.BYD_CONTROL_PIN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
