name: Poll BYD Atto 3

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs slightly under load.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python poll.py
        env:
          BYD_USERNAME: ${{ secrets.BYD_USERNAME }}
          BYD_PASSWORD: ${{ secrets.BYD_PASSWORD }}
          BYD_COUNTRY_CODE: ${{ secrets.BYD_COUNTRY_CODE }}
          BYD_BASE_URL: ${{ secrets.BYD_BASE_URL }}
          BYD_CONTROL_PIN: ${{ secrets.BYD_CONTROL_PIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
