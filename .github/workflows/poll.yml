name: Poll BYD Atto 3

on:
  # Triggered every 5 minutes by a Supabase pg_cron job calling the
  # "trigger-poll" Edge Function, which hits this workflow_dispatch
  # endpoint. GitHub's own native `schedule:` trigger is deliberately
  # NOT used here -- it's documented as best-effort and was observed
  # skipping ticks (a 23-minute gap during testing). Supabase's
  # Postgres-level pg_cron is the reliable clock instead.
  #
  # "force" bypasses poll.py's configurable-interval throttle -- the
  # automatic pg_cron path always passes false (respects whatever
  # interval is set in Settings), while a manual "Poll Now" from the
  # dashboard always passes true, so it never silently does nothing
  # just because a slower interval happens to be configured.
  # "source" distinguishes the normal 5-min cron from the 1-min
  # fast-charge-detection cron -- poll.py treats "fast" completely
  # differently: it ONLY ever bypasses the throttle for genuine fast
  # charging (>=5kW), never for any other reason, since the 1-min cron
  # must never behave like a fast, always-on poll for normal charging.
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the configured poll interval'
        required: false
        default: 'false'
      source:
        description: 'normal (5-min cron) or fast (1-min fast-charge cron)'
        required: false
        default: 'normal'

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python poll.py
        env:
          BYD_USERNAME: ${{ secrets.BYD_USERNAME }}
          BYD_PASSWORD: ${{ secrets.BYD_PASSWORD }}
          BYD_COUNTRY_CODE: ${{ secrets.BYD_COUNTRY_CODE }}
          BYD_BASE_URL: ${{ secrets.BYD_BASE_URL }}
          BYD_CONTROL_PIN: ${{ secrets.BYD_CONTROL_PIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_POLL: ${{ github.event.inputs.force }}
          TRIGGER_SOURCE: ${{ github.event.inputs.source }}
