<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Charge Details — Atto 3</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
  :root{
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --hairline: rgba(60,60,67,0.29);
    --text: #1C1C1E;
    --text-secondary: #8E8E93;
    --green: #34C759;
    --green-2: #30B855;
    --blue: #007AFF;
    --orange: #FF9500;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 30px rgba(0,0,0,0.045);
    --active-tint: rgba(60,60,67,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #000000;
      --card: #1C1C1E;
      --hairline: rgba(84,84,88,0.6);
      --text: #FFFFFF;
      --text-secondary: #8E8E93;
      --green: #30D158;
      --green-2: #27B34C;
      --blue: #0A84FF;
      --orange: #FF9F0A;
      --card-shadow: none;
      --active-tint: rgba(255,255,255,0.06);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  a { text-decoration: none; color: inherit; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: max(16px, calc(env(safe-area-inset-top) + 8px)) 16px calc(56px + env(safe-area-inset-bottom));
  }

  .back{
    display: inline-flex;
    align-items: center;
    gap: 2px;
    color: var(--blue);
    font-size: 17px;
    font-weight: 400;
    padding: 6px 4px 6px 0;
    margin-bottom: 8px;
  }
  .back svg{ width: 22px; height: 22px; }
  .back:active{ opacity: 0.5; }

  .hero{
    position: relative;
    border-radius: 20px;
    padding: 22px;
    color: #fff;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .hero.home{ background: linear-gradient(150deg, var(--green) 0%, var(--green-2) 55%, #1F8F3E 100%); box-shadow: 0 16px 32px rgba(52,199,89,0.22); }
  .hero.public{ background: linear-gradient(150deg, var(--blue) 0%, #0064D1 55%, #004999 100%); box-shadow: 0 16px 32px rgba(0,122,255,0.22); }
  .hero::after{
    content: "";
    position: absolute;
    top: -60%; right: -30%;
    width: 70%; height: 200%;
    background: radial-gradient(circle at center, rgba(255,255,255,0.16), transparent 60%);
    pointer-events: none;
  }
  .hero-place{ font-size: 13px; font-weight: 600; opacity: 0.85; }
  .hero-cost{ font-size: 44px; font-weight: 700; letter-spacing: -0.025em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .hero-pct{ font-size: 14px; opacity: 0.9; margin-top: 6px; }

  .group{ margin-top: 22px; }
  .group-header{
    font-size: 13px;
    font-weight: 590;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 0 0 8px 16px;
  }
  .group-card{
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }
  .row{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    min-height: 46px;
    border-bottom: 0.5px solid var(--hairline);
  }
  .row:last-child{ border-bottom: none; }
  .row .k{ font-size: 15.5px; color: var(--text); flex: 1; }
  .row .v{
    font-size: 15.5px;
    font-weight: 590;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .row .v.estimate{ color: var(--orange); }

  .loading, .not-found{
    padding: 60px 16px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 15px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Charges
    </a>

    <div id="content">
      <div class="loading">Loading…</div>
    </div>
  </div>

<script>
const SUPABASE_URL = "https://ujpcabmacpnbtyiharnk.supabase.co";
const SUPABASE_KEY = "sb_publishable_MYvAXGlFH-AyOkGU-FceYg_THPLZqCy";

async function sb(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
  });
  if (!res.ok) throw new Error(`Supabase fetch failed: ${res.status}`);
  return res.json();
}

const fmtMoney = (n) => n == null ? "—" : `$${Number(n).toFixed(2)}`;
const fmtKwh = (n) => n == null ? "—" : `${Number(n).toFixed(2)} kWh`;
const fmtKm = (n) => n == null ? "—" : `${Number(n).toFixed(0)} km`;
const fmtDate = (iso) => new Date(iso).toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtTime = (iso) => new Date(iso).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });

function fmtDuration(startIso, endIso) {
  const ms = new Date(endIso) - new Date(startIso);
  const totalMin = Math.round(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h === 0) return `${m} min`;
  return `${h}h ${m}min`;
}

function render(s) {
  const isHome = s.location_type === 'home';
  const placeLabel = isHome ? 'Home' : 'Public Charger';
  const pctDelta = (s.start_pct != null && s.end_pct != null) ? s.end_pct - s.start_pct : null;
  const rateEstimate = s.rate_confirmed === false;

  document.title = `${placeLabel} charge — Atto 3`;

  document.getElementById('content').innerHTML = `
    <div class="hero ${isHome ? 'home' : 'public'}">
      <div class="hero-place">${placeLabel}</div>
      <div class="hero-cost">${fmtMoney(s.cost)}</div>
      <div class="hero-pct">${pctDelta != null ? `${s.start_pct}% → ${s.end_pct}% (+${pctDelta}%)` : ''}</div>
    </div>

    <div class="group">
      <div class="group-header">When</div>
      <div class="group-card">
        <div class="row"><span class="k">Date</span><span class="v">${fmtDate(s.started_at)}</span></div>
        <div class="row"><span class="k">Started</span><span class="v">${fmtTime(s.started_at)}</span></div>
        <div class="row"><span class="k">Finished</span><span class="v">${fmtTime(s.ended_at)}</span></div>
        <div class="row"><span class="k">Duration</span><span class="v">${fmtDuration(s.started_at, s.ended_at)}</span></div>
      </div>
    </div>

    <div class="group">
      <div class="group-header">Battery &amp; Range</div>
      <div class="group-card">
        <div class="row"><span class="k">Battery</span><span class="v">${s.start_pct}% → ${s.end_pct}%</span></div>
        <div class="row"><span class="k">Range added</span><span class="v">${s.range_added_km != null ? `+${Number(s.range_added_km).toFixed(0)} km` : '—'}</span></div>
        <div class="row"><span class="k">Energy added</span><span class="v">${fmtKwh(s.energy_added_kwh)}</span></div>
      </div>
    </div>

    <div class="group">
      <div class="group-header">Cost</div>
      <div class="group-card">
        <div class="row"><span class="k">Location</span><span class="v">${placeLabel}</span></div>
        <div class="row"><span class="k">Rate</span><span class="v ${rateEstimate ? 'estimate' : ''}">${fmtMoney(s.electricity_rate)}/kWh${rateEstimate ? ' (est.)' : ''}</span></div>
        <div class="row"><span class="k">Total cost</span><span class="v">${fmtMoney(s.cost)}</span></div>
        <div class="row"><span class="k">Cost per km</span><span class="v">${s.cost_per_km != null ? `${(s.cost_per_km * 100).toFixed(1)}¢/km` : '—'}</span></div>
      </div>
    </div>

    <div class="group">
      <div class="group-header">Distance</div>
      <div class="group-card">
        <div class="row"><span class="k">Odometer at start</span><span class="v">${fmtKm(s.start_odometer_km)}</span></div>
        <div class="row"><span class="k">Odometer at end</span><span class="v">${fmtKm(s.end_odometer_km)}</span></div>
        <div class="row"><span class="k">Driven since last charge</span><span class="v">${s.km_since_last_charge != null ? fmtKm(s.km_since_last_charge) : 'first tracked charge'}</span></div>
      </div>
    </div>
  `;
}

async function load() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) {
    document.getElementById('content').innerHTML = '<div class="not-found">No charge specified.</div>';
    return;
  }
  try {
    const rows = await sb(`charging_sessions_detailed?id=eq.${encodeURIComponent(id)}&select=*`);
    if (!rows.length) {
      document.getElementById('content').innerHTML = '<div class="not-found">Charge not found.</div>';
      return;
    }
    render(rows[0]);
  } catch (err) {
    document.getElementById('content').innerHTML = '<div class="not-found">Failed to load this charge.</div>';
    console.error(err);
  }
}

load();
</script>
</body>
</html>
