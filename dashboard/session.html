<!doctype html>
<html lang="en">
<head>

<title>Charge Details — Atto 3</title>

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --hairline: rgba(60,60,67,0.29);
    --text: #1C1C1E;
    --text-secondary: #8E8E93;
    --green: #34C759;
    --green-2: #30B855;
    --blue: #007AFF;
    --orange: #FF9500;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 30px rgba(0,0,0,0.045);
    --active-tint: rgba(60,60,67,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #000000;
      --card: #1C1C1E;
      --hairline: rgba(84,84,88,0.6);
      --text: #FFFFFF;
      --text-secondary: #8E8E93;
      --green: #30D158;
      --green-2: #27B34C;
      --blue: #0A84FF;
      --orange: #FF9F0A;
      --card-shadow: none;
      --active-tint: rgba(255,255,255,0.06);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  a { text-decoration: none; color: inherit; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    touch-action: manipulation;
  }

  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: max(16px, calc(env(safe-area-inset-top) + 8px)) 16px calc(56px + env(safe-area-inset-bottom));
  }

  .back{
    display: inline-flex;
    align-items: center;
    gap: 2px;
    color: var(--blue);
    font-size: 17px;
    font-weight: 400;
    padding: 6px 4px 6px 0;
    margin-bottom: 8px;
  }
  .back svg{ width: 22px; height: 22px; }
  .back:active{ opacity: 0.5; }

  .hero{
    position: relative;
    border-radius: 20px;
    padding: 22px;
    color: #fff;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .hero.home{ background: linear-gradient(150deg, var(--green) 0%, var(--green-2) 55%, #1F8F3E 100%); box-shadow: 0 16px 32px rgba(52,199,89,0.22); }
  .hero.public{ background: linear-gradient(150deg, var(--blue) 0%, #0064D1 55%, #004999 100%); box-shadow: 0 16px 32px rgba(0,122,255,0.22); }
  .hero-share-btn{
    position: absolute;
    top: 18px; right: 18px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.18);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
  }
  .hero-share-btn svg{ width: 16px; height: 16px; }
  .hero-share-btn:active{ opacity: 0.6; }
  .hero::after{
    content: "";
    position: absolute;
    top: -60%; right: -30%;
    width: 70%; height: 200%;
    background: radial-gradient(circle at center, rgba(255,255,255,0.16), transparent 60%);
    pointer-events: none;
  }
  .hero-place{ font-size: 13px; font-weight: 600; opacity: 0.85; }
  .hero-cost{ font-size: 44px; font-weight: 700; letter-spacing: -0.025em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .hero-pct{ font-size: 14px; opacity: 0.9; margin-top: 6px; }

  .group{ margin-top: 22px; }
  .group-header{
    font-size: 13px;
    font-weight: 590;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 0 0 8px 16px;
  }
  .group-card{
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }
  .row{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    min-height: 46px;
    border-bottom: 0.5px solid var(--hairline);
  }
  .row:last-child{ border-bottom: none; }
  .row .k{ font-size: 15.5px; color: var(--text); flex: 1; }
  .row .v{
    font-size: 15.5px;
    font-weight: 590;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .row .v.estimate{ color: var(--orange); }

  .group-header-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 8px 0;
  }
  .group-header-row .group-header{ margin: 0 0 0 16px; }
  .edit-link{
    border: none;
    background: none;
    color: var(--blue);
    font-size: 14px;
    font-weight: 500;
    padding: 4px 16px 4px 8px;
    cursor: pointer;
  }
  .edit-link:active{ opacity: 0.5; }

  .edit-pad{ padding: 16px; }
  .segmented{
    display: flex;
    background: rgba(118,118,128,0.12);
    border-radius: 9px;
    padding: 2px;
    margin-bottom: 16px;
  }
  .segmented button{
    flex: 1;
    border: none;
    background: transparent;
    padding: 7px 4px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 590;
    color: var(--text);
    border-radius: 7px;
    cursor: pointer;
  }
  .segmented button.active{ background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

  .edit-label{
    display: block;
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .edit-input{
    width: 100%;
    font-family: inherit;
    font-size: 17px;
    font-variant-numeric: tabular-nums;
    padding: 10px 12px;
    border-radius: 10px;
    border: 0.5px solid var(--hairline);
    background: var(--bg);
    color: var(--text);
    margin-bottom: 16px;
  }
  .edit-actions{ display: flex; gap: 10px; }
  .edit-btn-save, .edit-btn-cancel{
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 590;
    cursor: pointer;
  }
  .edit-btn-save{ background: var(--blue); color: #fff; }
  .edit-btn-save:active{ opacity: 0.7; }
  .edit-btn-cancel{ background: rgba(118,118,128,0.16); color: var(--text); }
  .edit-btn-cancel:active{ opacity: 0.7; }
  .edit-status{ font-size: 13px; color: var(--text-secondary); margin-top: 10px; text-align: center; }
  .edit-status.error{ color: var(--orange); }

  .ptr-indicator{
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    left: 50%;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--card);
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--green);
    z-index: 50;
    transform: translate(-50%, -60px);
    pointer-events: none;
  }
  .ptr-indicator svg{ width: 16px; height: 16px; }
  .ptr-indicator.spinning svg{ animation: ptr-spin 0.7s linear infinite; }
  @keyframes ptr-spin{ to{ transform: rotate(360deg); } }

  .passkey-overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    animation: pk-fade .2s ease;
  }
  @keyframes pk-fade{ from{ opacity: 0; } to{ opacity: 1; } }
  .passkey-sheet{
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    animation: pk-rise .25s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes pk-rise{ from{ transform: translateY(100%); } to{ transform: translateY(0); } }
  .passkey-title{ font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .passkey-sub{ font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }
  .passkey-input{
    width: 100%;
    font-family: inherit;
    font-size: 20px;
    letter-spacing: 0.1em;
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    border: 0.5px solid var(--hairline);
    background: var(--bg);
    color: var(--text);
    margin-bottom: 14px;
  }
  .passkey-error{ font-size: 13px; color: var(--orange); text-align: center; margin: -6px 0 12px; min-height: 16px; }
  .passkey-actions{ display: flex; gap: 10px; }
  .passkey-cancel, .passkey-submit{
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 590;
    cursor: pointer;
  }
  .passkey-submit{ background: var(--blue); color: #fff; }
  .passkey-cancel{ background: rgba(118,118,128,0.16); color: var(--text); }

  .chart-card{
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--card-shadow);
    padding: 16px 16px 8px;
  }
  .curve-axis-label{ font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
  .curve-x-labels{
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-secondary);
  }

  .fun-card{
    padding: 18px 18px 16px;
    background: linear-gradient(160deg, #2C1F0A 0%, #4A2E0A 100%);
  }
  @media (prefers-color-scheme: light){
    .fun-card{ background: linear-gradient(160deg, #FFF6E5 0%, #FFE9C2 100%); }
  }
  .fun-line{
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
  }
  .fun-line b{ font-variant-numeric: tabular-nums; }
  .fun-note{
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 10px;
    line-height: 1.4;
  }

  .loading, .not-found{
    padding: 60px 16px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 15px;
  }
</style>

<script>
const SUPABASE_URL = "https://ujpcabmacpnbtyiharnk.supabase.co";
const SUPABASE_KEY = "sb_publishable_MYvAXGlFH-AyOkGU-FceYg_THPLZqCy";

async function sb(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
  });
  if (!res.ok) throw new Error(`Supabase fetch failed: ${res.status}`);
  return res.json();
}

const fmtMoney = (n) => n == null ? "—" : `$${Number(n).toFixed(2)}`;
const fmtKwh = (n) => n == null ? "—" : `${Number(n).toFixed(2)} kWh`;
const fmtKm = (n) => n == null ? "—" : `${Number(n).toFixed(0)} km`;
const fmtDate = (iso) => new Date(iso).toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtTime = (iso) => new Date(iso).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });

function fmtDuration(startIso, endIso) {
  const ms = new Date(endIso) - new Date(startIso);
  const totalMin = Math.round(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h === 0) return `${m} min`;
  return `${h}h ${m}min`;
}

function render(s) {
  const isHome = s.location_type === 'home';
  const placeLabel = isHome ? 'Home' : 'Public Charger';
  const pctDelta = (s.start_pct != null && s.end_pct != null) ? s.end_pct - s.start_pct : null;
  const rateEstimate = s.rate_confirmed === false;

  document.title = `${placeLabel} charge — Atto 3`;

  document.getElementById('content').innerHTML = `
    <div class="hero ${isHome ? 'home' : 'public'}">
      <button class="hero-share-btn" id="session-share-btn" aria-label="Share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6 12 2 8 6"/><path d="M12 2v14"/></svg>
      </button>
      <div class="hero-place">${placeLabel}</div>
      <div class="hero-cost">${fmtMoney(s.cost)}</div>
      <div class="hero-pct">${pctDelta != null ? `${s.start_pct}% → ${s.end_pct}% (+${pctDelta}%)` : ''}</div>
    </div>

    <div class="group">
      <div class="group-header">When</div>
      <div class="group-card">
        <div class="row"><span class="k">Date</span><span class="v">${fmtDate(s.started_at)}</span></div>
        <div class="row"><span class="k">Started</span><span class="v">${fmtTime(s.started_at)}</span></div>
        <div class="row"><span class="k">Finished</span><span class="v">${fmtTime(s.ended_at)}</span></div>
        <div class="row"><span class="k">Duration</span><span class="v">${fmtDuration(s.started_at, s.ended_at)}</span></div>
      </div>
    </div>

    <div class="group">
      <div class="group-header">Battery &amp; Range</div>
      <div class="group-card">
        <div class="row"><span class="k">Battery</span><span class="v">${s.start_pct}% → ${s.end_pct}%</span></div>
        <div class="row"><span class="k">Range added</span><span class="v">${s.range_added_km != null ? `+${Number(s.range_added_km).toFixed(0)} km` : '—'}</span></div>
        <div class="row"><span class="k">Energy added</span><span class="v">${fmtKwh(s.energy_added_kwh)}</span></div>
      </div>
    </div>

    <div class="group">
      <div class="group-header">Charging Power</div>
      <div class="group-card">
        <div class="row"><span class="k">Peak power</span><span class="v" id="peak-kw">—</span></div>
        <div class="row"><span class="k">Average power</span><span class="v" id="avg-kw">—</span></div>
      </div>
      <div class="chart-card" style="margin-top:10px;">
        <div class="curve-axis-label" id="curve-y-label">kW</div>
        <svg id="charge-curve-chart" width="100%" height="90" viewBox="0 0 860 90" preserveAspectRatio="none"></svg>
        <div class="curve-x-labels" id="curve-x-labels"></div>
      </div>
    </div>

    <div class="group" id="efficiency-section" style="display:none;">
      <div class="group-header">Efficiency</div>
      <div class="group-card">
        <div class="row"><span class="k">Estimated energy used</span><span class="v" id="charge-energy-used">—</span></div>
        <div class="row"><span class="k">Efficiency</span><span class="v" id="charge-efficiency-value">—</span></div>
      </div>
    </div>

    <div class="group" id="fun-section" style="display:none;">
      <div class="group-header">Just For Fun</div>
      <div class="group-card fun-card" id="fun-content"></div>
    </div>

    <div class="group">
      <div class="group-header-row">
        <div class="group-header">Cost</div>
        <button class="edit-link" id="edit-btn">Edit</button>
      </div>

      <div class="group-card" id="cost-display">
        <div class="row"><span class="k">Location</span><span class="v">${placeLabel}</span></div>
        <div class="row"><span class="k">Rate</span><span class="v ${rateEstimate ? 'estimate' : ''}">${fmtMoney(s.electricity_rate)}/kWh${rateEstimate ? ' (est.)' : ''}</span></div>
        <div class="row"><span class="k">Total cost</span><span class="v">${fmtMoney(s.cost)}</span></div>
        <div class="row"><span class="k">Cost per km</span><span class="v">${s.cost_per_km != null ? `${(s.cost_per_km * 100).toFixed(1)}¢/km` : '—'}</span></div>
      </div>

      <div class="group-card" id="cost-edit" style="display:none;">
        <div class="edit-pad">
          <div class="segmented" id="location-toggle">
            <button data-loc="home" class="${isHome ? 'active' : ''}">Home</button>
            <button data-loc="public" class="${!isHome ? 'active' : ''}">Public Charger</button>
          </div>
          <label class="edit-label">Rate ($/kWh)</label>
          <input type="number" step="0.01" min="0" id="rate-input" class="edit-input" value="${s.electricity_rate ?? ''}">
          <div class="edit-actions">
            <button class="edit-btn-save" id="save-btn">Save</button>
            <button class="edit-btn-cancel" id="cancel-btn">Cancel</button>
          </div>
          <div class="edit-status" id="edit-status"></div>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-header">Distance</div>
      <div class="group-card">
        ${s.start_odometer_km != null && s.end_odometer_km != null && Number(s.start_odometer_km) !== Number(s.end_odometer_km) ? `
          <div class="row"><span class="k">Odometer at start</span><span class="v">${fmtKm(s.start_odometer_km)}</span></div>
          <div class="row"><span class="k">Odometer at end</span><span class="v">${fmtKm(s.end_odometer_km)}</span></div>
        ` : `
          <div class="row"><span class="k">Odometer</span><span class="v">${fmtKm(s.end_odometer_km ?? s.start_odometer_km)}</span></div>
        `}
        <div class="row"><span class="k">Driven since last charge</span><span class="v">${s.km_since_last_charge != null ? fmtKm(s.km_since_last_charge) : 'first tracked charge'}</span></div>
      </div>
    </div>
  `;

  document.getElementById('session-share-btn').addEventListener('click', () => shareSession(s, placeLabel));
}

const PASSKEY_STORAGE_KEY = 'atto3_passkey';
const EDIT_URL = `${SUPABASE_URL}/functions/v1/edit-session`;

function showPasskeyModal(errorMsg) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'passkey-overlay';
    overlay.innerHTML = `
      <div class="passkey-sheet">
        <div class="passkey-title">Enter Passkey</div>
        <div class="passkey-sub">Required to poll the car or edit a charge.</div>
        <input type="password" inputmode="numeric" class="passkey-input" id="passkey-input" autocomplete="off">
        <div class="passkey-error">${errorMsg || ''}</div>
        <div class="passkey-actions">
          <button class="passkey-cancel" id="passkey-cancel">Cancel</button>
          <button class="passkey-submit" id="passkey-submit">Unlock</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#passkey-input');
    setTimeout(() => input.focus(), 50);

    const cleanup = (value) => { overlay.remove(); resolve(value); };
    overlay.querySelector('#passkey-cancel').addEventListener('click', () => cleanup(null));
    overlay.querySelector('#passkey-submit').addEventListener('click', () => cleanup(input.value || null));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') cleanup(input.value || null); });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) cleanup(null); });
  });
}

async function getPasskey(errorMsg) {
  const stored = localStorage.getItem(PASSKEY_STORAGE_KEY);
  if (stored && !errorMsg) return stored;
  const entered = await showPasskeyModal(errorMsg);
  if (!entered) return null;
  localStorage.setItem(PASSKEY_STORAGE_KEY, entered);
  return entered;
}

function clearStoredPasskey() {
  localStorage.removeItem(PASSKEY_STORAGE_KEY);
}

// Applies the edit via the passkey-gated Edge Function (which alone holds
// write access now) rather than patching the database directly.
async function applyEdit(sessionId, locationType, rate, passkey) {
  const res = await fetch(EDIT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ passkey, session_id: sessionId, location_type: locationType, electricity_rate: rate }),
  });
  if (res.status === 401) {
    clearStoredPasskey();
    return { ok: false, wrongPasskey: true };
  }
  if (!res.ok) return { ok: false, wrongPasskey: false };
  return { ok: true };
}

function wireEditControls(s) {
  let selectedLoc = s.location_type === 'public' ? 'public' : 'home';

  const editBtn = document.getElementById('edit-btn');
  const display = document.getElementById('cost-display');
  const editPanel = document.getElementById('cost-edit');
  const status = document.getElementById('edit-status');

  editBtn.addEventListener('click', () => {
    display.style.display = 'none';
    editPanel.style.display = 'block';
    editBtn.style.display = 'none';
  });

  document.getElementById('cancel-btn').addEventListener('click', () => {
    display.style.display = 'block';
    editPanel.style.display = 'none';
    editBtn.style.display = 'block';
    status.textContent = '';
  });

  document.getElementById('location-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    selectedLoc = btn.dataset.loc;
    document.querySelectorAll('#location-toggle button').forEach(b => b.classList.toggle('active', b === btn));
  });

  document.getElementById('save-btn').addEventListener('click', async () => {
    const rateInput = document.getElementById('rate-input');
    const rate = parseFloat(rateInput.value);
    if (isNaN(rate) || rate < 0) {
      status.textContent = 'Enter a valid rate.';
      status.classList.add('error');
      return;
    }
    status.classList.remove('error');

    const passkey = await getPasskey();
    if (!passkey) return;

    status.textContent = 'Saving\u2026';
    try {
      let result = await applyEdit(s.id, selectedLoc, rate, passkey);
      if (result.wrongPasskey) {
        const retryKey = await getPasskey('Incorrect passkey \u2014 try again.');
        if (!retryKey) { status.textContent = ''; return; }
        result = await applyEdit(s.id, selectedLoc, rate, retryKey);
      }
      if (!result.ok) throw new Error('save failed');
      await load();
    } catch (err) {
      status.textContent = 'Failed to save — try again.';
      status.classList.add('error');
      console.error(err);
    }
  });
}

async function loadChargingCurve(s) {
  const endTime = s.ended_at || new Date().toISOString();
  const snapshots = await sb(`vehicle_snapshots?recorded_at=gte.${encodeURIComponent(s.started_at)}&recorded_at=lte.${encodeURIComponent(endTime)}&select=recorded_at,battery_pct,charging_power_kw&order=recorded_at.asc`);
  const usable = snapshots.filter(sn => sn.charging_power_kw != null && sn.battery_pct != null);

  if (usable.length === 0) return;

  const powers = usable.map(sn => Number(sn.charging_power_kw));
  const peak = Math.max(...powers);
  const avg = powers.reduce((a, b) => a + b, 0) / powers.length;
  document.getElementById('peak-kw').textContent = `${peak.toFixed(1)} kW`;
  document.getElementById('avg-kw').textContent = `${avg.toFixed(1)} kW`;

  const pcts = usable.map(sn => Number(sn.battery_pct));
  const minPct = Math.min(...pcts), maxPct = Math.max(...pcts);
  const pctRange = Math.max(maxPct - minPct, 1);
  const maxPower = Math.max(peak, 0.1);

  const w = 860, h = 90, pad = 6;
  const points = usable.map(sn => {
    const x = pad + ((Number(sn.battery_pct) - minPct) / pctRange) * (w - pad * 2);
    const y = h - pad - (Number(sn.charging_power_kw) / maxPower) * (h - pad * 2);
    return [x, y];
  });
  const path = points.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const area = `${path} L${points[points.length - 1][0].toFixed(1)},${h} L${points[0][0].toFixed(1)},${h} Z`;
  const accent = window.matchMedia('(prefers-color-scheme: dark)').matches ? '#0A84FF' : '#007AFF';

  document.getElementById('charge-curve-chart').innerHTML = `
    <defs>
      <linearGradient id="curveFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${accent}" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#curveFade)"/>
    <path d="${path}" fill="none" stroke="${accent}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  `;
  document.getElementById('curve-y-label').textContent = `kW (peak ${peak.toFixed(1)})`;
  document.getElementById('curve-x-labels').innerHTML = `<span>${minPct}% SOC</span><span>${maxPct}% SOC</span>`;
}

async function loadEfficiencyAndFun(s) {
  // Most precise available method: directly measure the battery % lost
  // during the actual driving that happened between the end of the
  // PRECEDING charge and the start of THIS one, using our own snapshot
  // history -- not the car's own self-reported efficiency (its own
  // internal estimate, unverified), and not the old broken approach
  // (attributing a whole preceding charge's total energy to a short
  // subsequent drive, which breaks under frequent top-ups).
  //
  // Only % drops where the odometer was actually moving count --
  // standby/vampire drain while parked is excluded, using the same
  // logic as the Standby Loss card, just inverted (that one sums
  // parked-only drops; this sums driving-only drops).
  const km = s.km_since_last_charge != null ? Number(s.km_since_last_charge) : null;
  if (km == null || km <= 0) return; // first tracked charge, or no driving recorded before it

  try {
    const prevRows = await sb(`charging_sessions?started_at=lt.${encodeURIComponent(s.started_at)}&ended_at=not.is.null&select=ended_at,electricity_rate&order=started_at.desc&limit=1`);
    const prev = prevRows[0];
    if (!prev) return;

    const snapshots = await sb(`vehicle_snapshots?recorded_at=gte.${encodeURIComponent(prev.ended_at)}&recorded_at=lte.${encodeURIComponent(s.started_at)}&select=recorded_at,battery_pct,odometer_km,is_charging&order=recorded_at.asc`);

    let drivingPctLoss = 0;
    for (let i = 1; i < snapshots.length; i++) {
      const a = snapshots[i - 1], b = snapshots[i];
      if (a.is_charging || b.is_charging) continue;
      if (a.odometer_km == null || b.odometer_km == null || a.battery_pct == null || b.battery_pct == null) continue;
      if (Number(b.odometer_km) > Number(a.odometer_km)) { // odometer moved -- this segment was driving
        const drop = Number(a.battery_pct) - Number(b.battery_pct);
        if (drop > 0) drivingPctLoss += drop;
      }
    }
    if (drivingPctLoss <= 0) return; // no measurable driving-attributable loss captured

    const settingsRows = await sb('tracker_settings?select=battery_capacity_kwh,petrol_price_per_l,petrol_l_per_100km');
    const settings = settingsRows[0];
    if (!settings?.battery_capacity_kwh) return;

    const kwhUsed = (drivingPctLoss / 100) * Number(settings.battery_capacity_kwh);
    const efficiency = (kwhUsed / km) * 100; // kWh/100km
    const rate = prev.electricity_rate != null ? Number(prev.electricity_rate) : null;

    document.getElementById('efficiency-section').style.display = 'block';
    document.getElementById('charge-efficiency-value').textContent = `${efficiency.toFixed(1)} kWh/100km`;
    document.getElementById('charge-energy-used').textContent = fmtKwh(kwhUsed);

    const litresEquivalent = (km / 100) * settings.petrol_l_per_100km;
    const petrolCost = litresEquivalent * settings.petrol_price_per_l;
    const electricityCost = rate != null ? kwhUsed * rate : null;
    const co2Kg = litresEquivalent * 2.31;

    document.getElementById('fun-section').style.display = 'block';
    document.getElementById('fun-content').innerHTML = `
      <div class="fun-line">Over <b>${km.toFixed(0)} km</b> since your last charge, an equivalent petrol car would've cost about <b>${fmtMoney(petrolCost)}</b> to run.</div>
      ${electricityCost != null ? `
        <div class="fun-line" style="margin-top:8px;">You spent about <b>${fmtMoney(electricityCost)}</b> in electricity instead \u2014 roughly <b>${fmtMoney(petrolCost - electricityCost)}</b> saved, and about <b>${co2Kg.toFixed(0)} kg</b> of CO\u2082 avoided.</div>
      ` : ''}
      <div class="fun-note">Based on the actual battery % lost while driving these km (${drivingPctLoss.toFixed(1)}%, standby drain excluded) and the previous charge's rate \u2014 a rough comparison, not precise accounting.</div>
    `;
  } catch (err) {
    console.error('efficiency/fun load failed', err);
  }
}

async function load() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) {
    document.getElementById('content').innerHTML = '<div class="not-found">No charge specified.</div>';
    return;
  }
  try {
    const rows = await sb(`charging_sessions_detailed?id=eq.${encodeURIComponent(id)}&select=*`);
    if (!rows.length) {
      document.getElementById('content').innerHTML = '<div class="not-found">Charge not found.</div>';
      return;
    }
    render(rows[0]);
    wireEditControls(rows[0]);
    await loadChargingCurve(rows[0]);
    await loadEfficiencyAndFun(rows[0]);
  } catch (err) {
    document.getElementById('content').innerHTML = '<div class="not-found">Failed to load this charge.</div>';
    console.error(err);
  }
}

load();

(function setupPullToRefresh() {
  const indicator = document.createElement('div');
  indicator.className = 'ptr-indicator';
  indicator.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>`;
  document.body.appendChild(indicator);

  const THRESHOLD = 64, MAX_PULL = 90;
  let startY = 0, lastDist = 0, pulling = false, refreshing = false;

  document.addEventListener('touchstart', (e) => {
    if (refreshing || (document.scrollingElement.scrollTop || 0) > 0) return;
    startY = e.touches[0].clientY;
    pulling = true;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!pulling || refreshing) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) return;
    lastDist = Math.min(MAX_PULL, dy * 0.45);
    indicator.style.transform = `translate(-50%, ${lastDist - 60}px)`;
    if (dy > 10) e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', async () => {
    if (!pulling) return;
    pulling = false;
    if (lastDist >= THRESHOLD && !refreshing) {
      refreshing = true;
      indicator.classList.add('spinning');
      indicator.style.transform = 'translate(-50%, 16px)';
      await load();
      refreshing = false;
      indicator.classList.remove('spinning');
    }
    indicator.style.transform = 'translate(-50%, -60px)';
    lastDist = 0;
  });
})();
</script>

<div id="session-share-card" style="position:fixed; left:-9999px; top:0; width:360px; padding:28px 24px; background:linear-gradient(160deg, #1C1C1E 0%, #2C2C2E 100%); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#fff; border-radius:20px;">
  <div style="display:flex; align-items:center; margin-bottom:20px;">
    <svg viewBox="0 0 24 24" fill="#34C759" style="width:22px; height:22px;"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
  </div>
  <div id="ssc-title" style="font-size:24px; font-weight:700; margin-bottom:4px;"></div>
  <div id="ssc-sub" style="font-size:14px; opacity:0.6; margin-bottom:22px;"></div>
  <div id="ssc-stats" style="display:grid; grid-template-columns:1fr 1fr; gap:16px;"></div>
  <div style="margin-top:22px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.12); font-size:11px; opacity:0.4;" id="ssc-footer"></div>
</div>

<script>
async function shareSession(s, placeLabel) {
  const card = document.getElementById('session-share-card');
  const titleEl = document.getElementById('ssc-title');
  const subEl = document.getElementById('ssc-sub');
  const statsEl = document.getElementById('ssc-stats');
  const footerEl = document.getElementById('ssc-footer');

  function statBlock(label, value) {
    return `<div><div style="font-size:11px; opacity:0.55; margin-bottom:2px;">${label}</div><div style="font-size:19px; font-weight:600;">${value}</div></div>`;
  }

  const pctDelta = (s.start_pct != null && s.end_pct != null) ? s.end_pct - s.start_pct : null;
  titleEl.textContent = fmtMoney(s.cost);
  subEl.textContent = `${placeLabel}${pctDelta != null ? ` \u00b7 ${s.start_pct}% \u2192 ${s.end_pct}%` : ''}`;

  const peakKw = document.getElementById('peak-kw')?.textContent;
  const avgKw = document.getElementById('avg-kw')?.textContent;

  const blocks = [
    statBlock('Duration', fmtDuration(s.started_at, s.ended_at)),
    statBlock('Energy added', fmtKwh(s.energy_added_kwh)),
  ];
  if (peakKw && peakKw !== '\u2014') blocks.push(statBlock('Peak power', peakKw));
  if (avgKw && avgKw !== '\u2014') blocks.push(statBlock('Average power', avgKw));
  if (s.range_added_km != null) blocks.push(statBlock('Range added', `+${Number(s.range_added_km).toFixed(0)} km`));
  statsEl.innerHTML = blocks.join('');

  footerEl.textContent = fmtDate(s.started_at);

  try {
    const canvas = await html2canvas(card, { backgroundColor: null, scale: 2 });
    canvas.toBlob(async (blob) => {
      if (!blob) return;
      const file = new File([blob], 'atto3-charge.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file] });
        } catch (err) {
          if (err.name !== 'AbortError') console.error('share failed', err);
        }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'atto3-charge.png';
        a.click();
        URL.revokeObjectURL(url);
      }
    }, 'image/png');
  } catch (err) {
    console.error('share image generation failed', err);
  }
}
</script>
