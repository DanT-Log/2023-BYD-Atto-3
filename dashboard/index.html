<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Atto 3 — Charging Ledger</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icon-192.png" type="image/png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atto 3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
  :root{
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --hairline: rgba(60,60,67,0.29);
    --text: #1C1C1E;
    --text-secondary: #8E8E93;
    --green: #34C759;
    --green-2: #30B855;
    --blue: #007AFF;
    --orange: #FF9500;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 30px rgba(0,0,0,0.045);
    --active-tint: rgba(60,60,67,0.06);
    --segment-track: rgba(118,118,128,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #000000;
      --card: #1C1C1E;
      --hairline: rgba(84,84,88,0.6);
      --text: #FFFFFF;
      --text-secondary: #8E8E93;
      --green: #30D158;
      --green-2: #27B34C;
      --blue: #0A84FF;
      --orange: #FF9F0A;
      --card-shadow: none;
      --active-tint: rgba(255,255,255,0.06);
      --segment-track: rgba(118,118,128,0.24);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  a { text-decoration: none; color: inherit; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: max(20px, calc(env(safe-area-inset-top) + 12px)) 16px calc(56px + env(safe-area-inset-bottom));
  }

  .header-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 2px 16px;
  }
  .title{
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.021em;
  }
  .refresh-btn{
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--card);
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--green);
    padding: 0;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
  }
  .refresh-btn:active{ background: var(--active-tint); transform: scale(0.92); }
  .refresh-btn svg{ width: 18px; height: 18px; transition: transform .6s cubic-bezier(.2,.9,.3,1); }
  .refresh-btn.spinning svg{ transform: rotate(360deg); }

  /* Hero: Wallet-pass style card */
  .hero{
    position: relative;
    border-radius: 20px;
    padding: 22px 22px 24px;
    background: linear-gradient(150deg, var(--green) 0%, var(--green-2) 55%, #1F8F3E 100%);
    color: #fff;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 16px 32px rgba(52,199,89,0.22);
    opacity: 0;
    transform: translateY(6px) scale(0.99);
    animation: hero-in .55s cubic-bezier(.2,.9,.3,1) .05s forwards;
  }
  @keyframes hero-in{ to{ opacity: 1; transform: translateY(0) scale(1); } }
  .hero::after{
    content: "";
    position: absolute;
    top: -60%; right: -30%;
    width: 70%; height: 200%;
    background: radial-gradient(circle at center, rgba(255,255,255,0.16), transparent 60%);
    pointer-events: none;
  }
  .hero-label{ font-size: 13px; font-weight: 600; letter-spacing: -0.01em; opacity: 0.85; }
  .hero-amount{
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.025em;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .hero-sub{ font-size: 13px; opacity: 0.85; margin-top: 6px; }

  /* Segmented control (Daily / Weekly / Monthly / All) */
  .segmented{
    display: flex;
    background: var(--segment-track);
    border-radius: 9px;
    padding: 2px;
    margin: 14px 0 14px;
  }
  .segmented button{
    flex: 1;
    border: none;
    background: transparent;
    padding: 6px 4px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 590;
    color: var(--text);
    border-radius: 7px;
    cursor: pointer;
    transition: background .18s ease;
  }
  .segmented button.active{
    background: var(--card);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }

  /* Grouped list, iOS Settings-style */
  .group{ margin-top: 24px; }
  .group-header{
    font-size: 13px;
    font-weight: 590;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 0 0 8px 16px;
  }
  .group-card{
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }

  .row{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    min-height: 46px;
    border-bottom: 0.5px solid var(--hairline);
  }
  .row:last-child{ border-bottom: none; }
  .row .k{ font-size: 15.5px; color: var(--text); flex: 1; }
  .row .v{
    font-size: 15.5px;
    font-weight: 590;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  /* Session rows, Wallet-transaction style */
  .session{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 0.5px solid var(--hairline);
    transition: background .15s ease;
  }
  .session:last-child{ border-bottom: none; }
  .session:active{ background: var(--active-tint); }

  .avatar{
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--green);
  }
  .avatar.public{ background: var(--blue); }
  .avatar svg{ width: 17px; height: 17px; }

  .session-mid{ flex: 1; min-width: 0; }
  .session-title{ font-size: 15.5px; font-weight: 500; }
  .session-sub{ font-size: 13px; color: var(--text-secondary); margin-top: 1px; }

  .session-amt{ text-align: right; flex-shrink: 0; }
  .session-amt .cost{ font-size: 15.5px; font-weight: 590; font-variant-numeric: tabular-nums; }
  .session-amt .place{ font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
  .session-amt .place.unconfirmed{ color: var(--orange); }

  .empty{
    padding: 28px 16px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14.5px;
  }

  /* Live status card, above the hero */
  .status-card{
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--card-shadow);
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .status-top{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot{
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--text-secondary);
    flex-shrink: 0;
  }
  .status-card.charging .status-dot{
    background: var(--green);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(52,199,89,0.45); }
    50%{ box-shadow: 0 0 0 6px rgba(52,199,89,0); }
  }
  .status-title{ font-size: 15.5px; font-weight: 590; }
  .status-idle-detail{
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
    margin-left: 17px;
  }
  .status-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
    margin-top: 12px;
  }
  .status-stat .k{ font-size: 12px; color: var(--text-secondary); }
  .status-stat .v{
    font-size: 17px;
    font-weight: 590;
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }
  .status-full-width{
    grid-column: 1 / -1;
    padding-top: 8px;
    margin-top: 2px;
    border-top: 0.5px solid var(--hairline);
  }

  .ptr-indicator{
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    left: 50%;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--card);
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--green);
    z-index: 50;
    transform: translate(-50%, -60px);
    pointer-events: none;
  }
  .ptr-indicator svg{ width: 16px; height: 16px; }
  .ptr-indicator.spinning svg{ animation: ptr-spin 0.7s linear infinite; }
  @keyframes ptr-spin{ to{ transform: rotate(360deg); } }

  .footnote{
    margin-top: 24px;
    padding: 0 16px;
    color: var(--text-secondary);
    font-size: 12.5px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header-row">
      <div class="title">Atto 3</div>
      <button class="refresh-btn" id="refresh-btn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <path d="M21 4v5h-5"/>
        </svg>
      </button>
    </div>

    <div class="status-card" id="status-card">
      <div class="status-top">
        <div class="status-dot"></div>
        <div class="status-title" id="status-title">Loading…</div>
      </div>
      <div class="status-idle-detail" id="status-idle-detail"></div>
      <div class="status-grid" id="status-grid" style="display:none;"></div>
    </div>

    <div class="hero">
      <div class="hero-label">Total spent charging</div>
      <div class="hero-amount" id="total-spent">$0.00</div>
      <div class="hero-sub" id="total-spent-sub">loading…</div>
    </div>

    <div class="group">
      <div class="group-header">Overview</div>
      <div class="segmented" id="period-tabs">
        <button data-period="daily">Daily</button>
        <button data-period="weekly">Weekly</button>
        <button data-period="monthly">Monthly</button>
        <button data-period="all">All</button>
      </div>
      <div class="group-card">
        <div class="row"><span class="k">Total energy added</span><span class="v" id="total-kwh">—</span></div>
        <div class="row"><span class="k">Km tracked between charges</span><span class="v" id="total-km">—</span></div>
        <div class="row"><span class="k">Avg cost / km</span><span class="v" id="avg-per-km">—</span></div>
        <div class="row"><span class="k">Avg cost / kWh</span><span class="v" id="avg-per-kwh">—</span></div>
      </div>
    </div>

    <div class="group">
      <div class="group-header">Efficiency</div>
      <div class="group-card">
        <div class="row"><span class="k">Your tracked efficiency</span><span class="v" id="tracked-efficiency">—</span></div>
        <div class="row"><span class="k">Car's own estimate</span><span class="v" id="car-efficiency">—</span></div>
      </div>
    </div>

    <div class="group">
      <div class="group-header">Recent Charges</div>
      <div class="group-card" id="sessions"></div>
    </div>

    <div class="footnote">Updates automatically as the car reports new data. Tap a charge for full details.</div>
  </div>

<script>
const SUPABASE_URL = "https://ujpcabmacpnbtyiharnk.supabase.co";
const SUPABASE_KEY = "sb_publishable_MYvAXGlFH-AyOkGU-FceYg_THPLZqCy";

const ICON_HOME = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>`;
const ICON_PUBLIC = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/></svg>`;

async function sb(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
  });
  if (!res.ok) throw new Error(`Supabase fetch failed: ${res.status}`);
  return res.json();
}

const fmtMoney = (n) => n == null ? "—" : `$${Number(n).toFixed(2)}`;
const fmtKwh = (n) => n == null ? "—" : `${Number(n).toFixed(1)} kWh`;
const fmtKm = (n) => n == null ? "—" : `${Number(n).toFixed(0)} km`;
const fmtDate = (iso) => new Date(iso).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
const fmtTime = (iso) => new Date(iso).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });

let allSessions = [];
let activePeriod = 'weekly';

function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function startOfWeek(d) {
  const x = startOfDay(d);
  const day = x.getDay(); // 0 = Sun .. 6 = Sat
  const diffToMonday = (day === 0 ? -6 : 1) - day;
  x.setDate(x.getDate() + diffToMonday);
  return x;
}
function startOfMonth(d) { const x = startOfDay(d); x.setDate(1); return x; }

function periodStart(period) {
  const now = new Date();
  if (period === 'daily') return startOfDay(now);
  if (period === 'weekly') return startOfWeek(now);
  if (period === 'monthly') return startOfMonth(now);
  return new Date(0); // all time
}

function computeSummary(sessions) {
  const totalCharges = sessions.length;
  const totalSpent = sessions.reduce((sum, s) => sum + (Number(s.cost) || 0), 0);
  const totalKwh = sessions.reduce((sum, s) => sum + (Number(s.energy_added_kwh) || 0), 0);
  const totalKm = sessions.reduce((sum, s) => sum + (Number(s.km_since_last_charge) || 0), 0);
  return {
    total_charges: totalCharges,
    total_spent: totalSpent,
    total_kwh: totalKwh,
    total_km_tracked: totalKm,
    avg_cost_per_km: totalKm > 0 ? totalSpent / totalKm : null,
    avg_cost_per_kwh: totalKwh > 0 ? totalSpent / totalKwh : null,
  };
}

function renderSummary(summary) {
  document.getElementById('total-spent').textContent = fmtMoney(summary.total_spent ?? 0);
  document.getElementById('total-spent-sub').textContent =
    summary.total_charges ? `${summary.total_charges} charge${summary.total_charges === 1 ? '' : 's'} this period` : 'No charges this period';
  document.getElementById('total-kwh').textContent = fmtKwh(summary.total_kwh);
  document.getElementById('total-km').textContent = fmtKm(summary.total_km_tracked);
  document.getElementById('avg-per-km').textContent = summary.avg_cost_per_km != null ? `${(summary.avg_cost_per_km * 100).toFixed(1)}¢` : '—';
  document.getElementById('avg-per-kwh').textContent = fmtMoney(summary.avg_cost_per_kwh);
}

function applyPeriod() {
  const since = periodStart(activePeriod);
  const filtered = allSessions.filter(s => new Date(s.started_at) >= since);
  renderSummary(computeSummary(filtered));

  document.querySelectorAll('#period-tabs button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.period === activePeriod);
  });
}

function renderSessions(sessions) {
  const el = document.getElementById('sessions');
  const done = sessions.filter(s => s.ended_at);

  if (done.length === 0) {
    el.innerHTML = '<div class="empty">No completed charges yet — check back once the car finishes a charge.</div>';
    return;
  }

  el.innerHTML = done.map(s => {
    const isHome = s.location_type === 'home';
    const placeLabel = isHome ? 'Home' : 'Public Charger';
    const timeRange = `${fmtTime(s.started_at)}–${fmtTime(s.ended_at)}`;
    return `
      <a class="session" href="session.html?id=${s.id}">
        <div class="avatar ${isHome ? '' : 'public'}">${isHome ? ICON_HOME : ICON_PUBLIC}</div>
        <div class="session-mid">
          <div class="session-title">${s.start_pct != null && s.end_pct != null ? `${s.start_pct}% → ${s.end_pct}%` : fmtDate(s.started_at)}</div>
          <div class="session-sub">${fmtDate(s.started_at)}, ${timeRange} · ${fmtKwh(s.energy_added_kwh)}</div>
        </div>
        <div class="session-amt">
          <div class="cost">${fmtMoney(s.cost)}</div>
          <div class="place ${s.rate_confirmed === false ? 'unconfirmed' : ''}">${placeLabel}</div>
        </div>
      </a>
    `;
  }).join('');
}

function relativeTime(iso) {
  const diffMin = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (diffMin < 1) return 'just now';
  if (diffMin === 1) return '1 min ago';
  if (diffMin < 60) return `${diffMin} min ago`;
  const diffH = Math.round(diffMin / 60);
  return diffH === 1 ? '1 hour ago' : `${diffH} hours ago`;
}

function fmtElapsed(startIso) {
  const totalMin = Math.max(0, Math.round((Date.now() - new Date(startIso).getTime()) / 60000));
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  return h === 0 ? `${m} min` : `${h}h ${m}min`;
}

// Mirrors poll.py's integrate_energy_kwh: trapezoidal between real readings,
// then holds the last known power flat through to "now".
function integrateEnergySoFar(snapshots) {
  const usable = snapshots.filter(s => s.charging_power_kw != null);
  if (usable.length === 0) return null;

  let total = 0;
  for (let i = 0; i < usable.length - 1; i++) {
    const t0 = new Date(usable[i].recorded_at), t1 = new Date(usable[i + 1].recorded_at);
    const hours = (t1 - t0) / 3600000;
    if (hours <= 0) continue;
    const p0 = Number(usable[i].charging_power_kw), p1 = Number(usable[i + 1].charging_power_kw);
    total += (p0 + p1) / 2 * hours;
  }
  const last = usable[usable.length - 1];
  const trailingHours = (Date.now() - new Date(last.recorded_at).getTime()) / 3600000;
  if (trailingHours > 0) total += Number(last.charging_power_kw) * trailingHours;
  return total;
}

function fmtFullByDate(target) {
  const now = new Date();
  const isToday = target.toDateString() === now.toDateString();
  const tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);
  const isTomorrow = target.toDateString() === tomorrow.toDateString();
  const timeStr = target.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
  if (isToday) return `Today, ${timeStr}`;
  if (isTomorrow) return `Tomorrow, ${timeStr}`;
  return `${target.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' })}, ${timeStr}`;
}

function fmtRemaining(target) {
  const ms = target - new Date();
  if (ms <= 0) return 'Any moment';
  const totalMin = Math.round(ms / 60000);
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  return h === 0 ? `${m} min` : `${h}h ${m}min`;
}

function renderChargingStatus(session, energyKwh, costSoFar, fullByTarget, batteryPct) {
  const card = document.getElementById('status-card');
  card.classList.add('charging');
  const isHome = session.location_type === 'home';
  const pctStr = batteryPct != null ? `, ${Math.round(batteryPct)}%` : '';
  document.getElementById('status-title').textContent = `Charging \u2014 ${isHome ? 'Home' : 'Public Charger'}${pctStr}`;
  document.getElementById('status-idle-detail').textContent = '';

  const grid = document.getElementById('status-grid');
  grid.style.display = 'grid';
  grid.innerHTML = `
    <div class="status-stat"><div class="k">Started</div><div class="v">${fmtTime(session.started_at)}</div></div>
    <div class="status-stat"><div class="k">Elapsed</div><div class="v">${fmtElapsed(session.started_at)}</div></div>
    <div class="status-stat"><div class="k">Energy so far</div><div class="v">${fmtKwh(energyKwh)}</div></div>
    <div class="status-stat"><div class="k">Cost so far</div><div class="v">${fmtMoney(costSoFar)}</div></div>
    ${fullByTarget ? `
      <div class="status-stat"><div class="k">Estimated full by</div><div class="v">${fmtFullByDate(fullByTarget)}</div></div>
      <div class="status-stat"><div class="k">Time remaining</div><div class="v">${fmtRemaining(fullByTarget)}</div></div>
    ` : ''}
  `;
}

function renderIdleStatus(snapshot) {
  const card = document.getElementById('status-card');
  card.classList.remove('charging');
  document.getElementById('status-grid').style.display = 'none';

  if (!snapshot) {
    document.getElementById('status-title').textContent = 'Not charging';
    document.getElementById('status-idle-detail').textContent = '';
    return;
  }
  document.getElementById('status-title').textContent = `Not charging \u2014 ${Math.round(snapshot.battery_pct)}% battery`;
  const rangeStr = snapshot.range_km != null ? `${Math.round(snapshot.range_km)} km range \u00b7 ` : '';
  document.getElementById('status-idle-detail').textContent = `${rangeStr}Updated ${relativeTime(snapshot.recorded_at)}`;
}

async function loadLiveStatus() {
  try {
    const openSessions = await sb('charging_sessions?ended_at=is.null&select=*&order=started_at.desc&limit=1');
    if (openSessions.length > 0) {
      const session = openSessions[0];
      const [snapshots, settingsRows] = await Promise.all([
        sb(`vehicle_snapshots?recorded_at=gte.${encodeURIComponent(session.started_at)}&select=recorded_at,charging_power_kw,battery_pct,remaining_hours,remaining_minutes,full_hour,full_minute&order=recorded_at.asc`),
        sb('tracker_settings?select=*'),
      ]);
      const settings = settingsRows[0] || {};
      const energyKwh = integrateEnergySoFar(snapshots);
      const rate = session.location_type === 'home' ? settings.home_rate_per_kwh : settings.public_rate_per_kwh;
      const costSoFar = (energyKwh != null && rate != null) ? energyKwh * rate : null;

      // Prefer the genuine countdown duration when the car actually reports
      // it (some accounts/vehicles don't populate it). Otherwise fall back
      // to the clock-time-of-day field, resolved unambiguously by anchoring
      // to that reading's own timestamp: if the target time-of-day has
      // already passed relative to when it was read, it must mean tomorrow.
      const withRemaining = [...snapshots].reverse().find(s => s.remaining_hours != null && s.remaining_minutes != null);
      const withFullTime = [...snapshots].reverse().find(s => s.full_hour != null && s.full_minute != null);
      let fullByTarget = null;
      if (withRemaining) {
        const anchor = new Date(withRemaining.recorded_at);
        fullByTarget = new Date(anchor.getTime() + (withRemaining.remaining_hours * 60 + withRemaining.remaining_minutes) * 60000);
      } else if (withFullTime) {
        const anchor = new Date(withFullTime.recorded_at);
        const target = new Date(anchor);
        target.setHours(withFullTime.full_hour, withFullTime.full_minute, 0, 0);
        // Only treat this as "must mean tomorrow" if the target trails the
        // anchor by more than an hour -- a lag of a few minutes is just
        // measurement noise from the field as the charge nears completion,
        // not a genuine overnight wraparound.
        const lagMinutes = (anchor - target) / 60000;
        if (lagMinutes > 60) target.setDate(target.getDate() + 1);
        fullByTarget = target;
      }

      const latestPct = [...snapshots].reverse().find(s => s.battery_pct != null)?.battery_pct;
      renderChargingStatus(session, energyKwh, costSoFar, fullByTarget, latestPct);
    } else {
      const latest = await sb('vehicle_snapshots?select=battery_pct,range_km,recorded_at&order=recorded_at.desc&limit=1');
      renderIdleStatus(latest[0] || null);
    }
  } catch (err) {
    console.error('live status failed', err);
  }
}

function computeTrackedEfficiency(sessions) {
  // km_since_last_charge on session N was driven on the battery charge
  // added during session N-1 -- so pair each session's km against the
  // PRECEDING session's energy, not its own.
  const asc = [...sessions].sort((a, b) => new Date(a.started_at) - new Date(b.started_at));
  let totalKm = 0, totalKwh = 0;
  for (let i = 1; i < asc.length; i++) {
    const km = Number(asc[i].km_since_last_charge);
    const kwh = Number(asc[i - 1].energy_added_kwh);
    if (!km || !kwh) continue;
    totalKm += km;
    totalKwh += kwh;
  }
  return totalKm > 0 ? (totalKwh / totalKm) * 100 : null;
}

async function loadEfficiency() {
  try {
    const tracked = computeTrackedEfficiency(allSessions);
    document.getElementById('tracked-efficiency').textContent =
      tracked != null ? `${tracked.toFixed(1)} kWh/100km` : 'Not enough data yet';

    const latest = await sb('vehicle_snapshots?select=car_reported_kwh_per_100km&order=recorded_at.desc&limit=1');
    const carValue = latest[0]?.car_reported_kwh_per_100km;
    document.getElementById('car-efficiency').textContent =
      carValue != null ? `${Number(carValue).toFixed(1)} kWh/100km` : '—';
  } catch (err) {
    console.error('efficiency load failed', err);
  }
}

async function load() {
  try {
    const sessions = await sb('charging_sessions_detailed?select=*&order=started_at.desc&limit=100');
    allSessions = sessions.filter(s => s.ended_at);
    applyPeriod();
    renderSessions(sessions);
    await loadLiveStatus();
    await loadEfficiency();
  } catch (err) {
    document.getElementById('total-spent-sub').textContent = 'Failed to load — check back shortly';
    console.error(err);
  }
}

document.getElementById('period-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  activePeriod = btn.dataset.period;
  applyPeriod();
});

const refreshBtn = document.getElementById('refresh-btn');
refreshBtn.addEventListener('click', async () => {
  if (refreshBtn.classList.contains('spinning')) return;
  refreshBtn.classList.add('spinning');
  await load();
  setTimeout(() => refreshBtn.classList.remove('spinning'), 600);
});

load();
setInterval(load, 60000);

// Custom pull-to-refresh: standalone/home-screen PWAs don't get Safari's
// native pull-to-refresh (that only works in a regular browser tab), so
// this reproduces the gesture by hand.
(function setupPullToRefresh() {
  const indicator = document.createElement('div');
  indicator.className = 'ptr-indicator';
  indicator.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>`;
  document.body.appendChild(indicator);

  const THRESHOLD = 64, MAX_PULL = 90;
  let startY = 0, lastDist = 0, pulling = false, refreshing = false;

  document.addEventListener('touchstart', (e) => {
    if (refreshing || (document.scrollingElement.scrollTop || 0) > 0) return;
    startY = e.touches[0].clientY;
    pulling = true;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!pulling || refreshing) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) return;
    lastDist = Math.min(MAX_PULL, dy * 0.45);
    indicator.style.transform = `translate(-50%, ${lastDist - 60}px)`;
    if (dy > 10) e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', async () => {
    if (!pulling) return;
    pulling = false;
    if (lastDist >= THRESHOLD && !refreshing) {
      refreshing = true;
      indicator.classList.add('spinning');
      indicator.style.transform = 'translate(-50%, 16px)';
      await load();
      refreshing = false;
      indicator.classList.remove('spinning');
    }
    indicator.style.transform = 'translate(-50%, -60px)';
    lastDist = 0;
  });
})();
</script>
