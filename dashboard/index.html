<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Atto 3 — Charging Ledger</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icon-192.png" type="image/png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atto 3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
  :root{
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --hairline: rgba(60,60,67,0.29);
    --text: #1C1C1E;
    --text-secondary: #8E8E93;
    --green: #34C759;
    --green-2: #30B855;
    --blue: #007AFF;
    --orange: #FF9500;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 30px rgba(0,0,0,0.045);
    --active-tint: rgba(60,60,67,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #000000;
      --card: #1C1C1E;
      --hairline: rgba(84,84,88,0.6);
      --text: #FFFFFF;
      --text-secondary: #8E8E93;
      --green: #30D158;
      --green-2: #27B34C;
      --blue: #0A84FF;
      --orange: #FF9F0A;
      --card-shadow: none;
      --active-tint: rgba(255,255,255,0.06);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: max(20px, calc(env(safe-area-inset-top) + 12px)) 16px calc(56px + env(safe-area-inset-bottom));
  }

  .title{
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.021em;
    margin: 4px 2px 16px;
  }

  /* Hero: Wallet-pass style card */
  .hero{
    position: relative;
    border-radius: 20px;
    padding: 22px 22px 24px;
    background: linear-gradient(150deg, var(--green) 0%, var(--green-2) 55%, #1F8F3E 100%);
    color: #fff;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 16px 32px rgba(52,199,89,0.22);
    opacity: 0;
    transform: translateY(6px) scale(0.99);
    animation: hero-in .55s cubic-bezier(.2,.9,.3,1) .05s forwards;
  }
  @keyframes hero-in{ to{ opacity: 1; transform: translateY(0) scale(1); } }
  .hero::after{
    content: "";
    position: absolute;
    top: -60%; right: -30%;
    width: 70%; height: 200%;
    background: radial-gradient(circle at center, rgba(255,255,255,0.16), transparent 60%);
    pointer-events: none;
  }
  .hero-label{
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    opacity: 0.85;
  }
  .hero-amount{
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.025em;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .hero-sub{
    font-size: 13px;
    opacity: 0.85;
    margin-top: 6px;
  }

  /* Grouped list, iOS Settings-style */
  .group{ margin-top: 28px; }
  .group-header{
    font-size: 13px;
    font-weight: 590;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 0 0 8px 16px;
  }
  .group-card{
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }

  .row{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    min-height: 46px;
    border-bottom: 0.5px solid var(--hairline);
  }
  .row:last-child{ border-bottom: none; }
  .row .k{ font-size: 15.5px; color: var(--text); flex: 1; }
  .row .v{
    font-size: 15.5px;
    font-weight: 590;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  /* Session rows, Wallet-transaction style */
  .session{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 0.5px solid var(--hairline);
    transition: background .15s ease;
  }
  .session:last-child{ border-bottom: none; }
  .session:active{ background: var(--active-tint); }

  .avatar{
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--green);
  }
  .avatar.public{ background: var(--blue); }
  .avatar svg{ width: 17px; height: 17px; }

  .session-mid{ flex: 1; min-width: 0; }
  .session-title{ font-size: 15.5px; font-weight: 500; }
  .session-sub{ font-size: 13px; color: var(--text-secondary); margin-top: 1px; }

  .session-amt{ text-align: right; flex-shrink: 0; }
  .session-amt .cost{
    font-size: 15.5px;
    font-weight: 590;
    font-variant-numeric: tabular-nums;
  }
  .session-amt .rate{
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .session-amt .rate.unconfirmed{ color: var(--orange); font-weight: 590; }

  .sparkline-card{
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--card-shadow);
    padding: 16px 16px 10px;
  }

  .empty{
    padding: 28px 16px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14.5px;
  }

  .footnote{
    margin-top: 24px;
    padding: 0 16px;
    color: var(--text-secondary);
    font-size: 12.5px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">Atto 3</div>

    <div class="hero">
      <div class="hero-label">Total spent charging</div>
      <div class="hero-amount" id="total-spent">$0.00</div>
      <div class="hero-sub" id="total-spent-sub">loading…</div>
    </div>

    <div class="group">
      <div class="group-header">Overview</div>
      <div class="group-card">
        <div class="row"><span class="k">Total energy added</span><span class="v" id="total-kwh">—</span></div>
        <div class="row"><span class="k">Km tracked between charges</span><span class="v" id="total-km">—</span></div>
        <div class="row"><span class="k">Avg cost / km</span><span class="v" id="avg-per-km">—</span></div>
        <div class="row"><span class="k">Avg cost / kWh</span><span class="v" id="avg-per-kwh">—</span></div>
      </div>
    </div>

    <div class="group">
      <div class="group-header">Cumulative Spend</div>
      <div class="sparkline-card">
        <svg id="spark" width="100%" height="64" viewBox="0 0 860 64" preserveAspectRatio="none"></svg>
      </div>
    </div>

    <div class="group">
      <div class="group-header">Recent Charges</div>
      <div class="group-card" id="sessions"></div>
    </div>

    <div class="footnote">Updates automatically as the car reports new data. Rates marked in orange are defaults, not yet confirmed.</div>
  </div>

<script>
const SUPABASE_URL = "https://ujpcabmacpnbtyiharnk.supabase.co";
const SUPABASE_KEY = "sb_publishable_MYvAXGlFH-AyOkGU-FceYg_THPLZqCy";

const ICON_HOME = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>`;
const ICON_PUBLIC = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/></svg>`;

async function sb(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
    },
  });
  if (!res.ok) throw new Error(`Supabase fetch failed: ${res.status}`);
  return res.json();
}

const fmtMoney = (n) => n == null ? "—" : `$${Number(n).toFixed(2)}`;
const fmtKwh = (n) => n == null ? "—" : `${Number(n).toFixed(1)} kWh`;
const fmtKm = (n) => n == null ? "—" : `${Number(n).toFixed(0)} km`;
const fmtDate = (iso) => new Date(iso).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });

function renderSummary(summary) {
  document.getElementById('total-spent').textContent = fmtMoney(summary.total_spent ?? 0);
  document.getElementById('total-spent-sub').textContent =
    summary.total_charges ? `${summary.total_charges} charge${summary.total_charges === 1 ? '' : 's'} tracked` : 'No completed charges yet';
  document.getElementById('total-kwh').textContent = fmtKwh(summary.total_kwh);
  document.getElementById('total-km').textContent = fmtKm(summary.total_km_tracked);
  document.getElementById('avg-per-km').textContent = summary.avg_cost_per_km != null ? `${(summary.avg_cost_per_km * 100).toFixed(1)}¢` : '—';
  document.getElementById('avg-per-kwh').textContent = fmtMoney(summary.avg_cost_per_kwh);
}

function currentAccent() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  return dark ? '#30D158' : '#34C759';
}

function renderSpark(sessions) {
  const svg = document.getElementById('spark');
  const done = sessions.filter(s => s.cost != null).slice().reverse();
  if (done.length < 2) { svg.innerHTML = ''; return; }

  let running = 0;
  const points = done.map(s => { running += Number(s.cost); return running; });
  const max = Math.max(...points);
  const w = 860, h = 64, pad = 4;
  const step = (w - pad * 2) / (points.length - 1);
  const accent = currentAccent();

  const coords = points.map((v, i) => {
    const x = pad + i * step;
    const y = h - pad - (v / (max || 1)) * (h - pad * 2);
    return [x, y];
  });

  const path = coords.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const area = `${path} L${coords[coords.length - 1][0].toFixed(1)},${h} L${coords[0][0].toFixed(1)},${h} Z`;

  svg.innerHTML = `
    <defs>
      <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${accent}" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#fade)" />
    <path d="${path}" fill="none" stroke="${accent}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  `;
}

function renderSessions(sessions) {
  const el = document.getElementById('sessions');
  const done = sessions.filter(s => s.ended_at);

  if (done.length === 0) {
    el.innerHTML = '<div class="empty">No completed charges yet — check back once the car finishes a charge.</div>';
    return;
  }

  el.innerHTML = done.map(s => {
    const isHome = s.location_type === 'home';
    return `
      <div class="session">
        <div class="avatar ${isHome ? '' : 'public'}">${isHome ? ICON_HOME : ICON_PUBLIC}</div>
        <div class="session-mid">
          <div class="session-title">${s.start_pct != null && s.end_pct != null ? `${s.start_pct}% → ${s.end_pct}%` : fmtDate(s.started_at)}</div>
          <div class="session-sub">${fmtDate(s.started_at)} · ${fmtKwh(s.energy_added_kwh)}${s.km_since_last_charge != null ? ` · ${fmtKm(s.km_since_last_charge)}` : ''}</div>
        </div>
        <div class="session-amt">
          <div class="cost">${fmtMoney(s.cost)}</div>
          <div class="rate ${s.rate_confirmed === false ? 'unconfirmed' : ''}">${s.rate_confirmed === false ? 'unconfirmed' : `${fmtMoney(s.electricity_rate)}/kWh`}</div>
        </div>
      </div>
    `;
  }).join('');
}

async function load() {
  try {
    const [summaryRows, sessions] = await Promise.all([
      sb('charging_summary?select=*'),
      sb('charging_sessions_detailed?select=*&order=started_at.desc&limit=50'),
    ]);
    const summary = summaryRows[0] || {};
    renderSummary(summary);
    renderSpark(sessions);
    renderSessions(sessions);
  } catch (err) {
    document.getElementById('total-spent-sub').textContent = 'Failed to load — check back shortly';
    console.error(err);
  }
}

load();
</script>
</body>
</html>
